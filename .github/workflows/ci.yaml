name: CI

on: [pull_request]

jobs:
  CI:
    name: Launching CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --python 3.11
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files
